# API on :8000, dashboard on :8501. Mount your policy folder at /policies.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      CLAUSEWISE_KEYS: ${CLAUSEWISE_KEYS:-emp-key:employee,hr-key:hr}
      CLAUSEWISE_POLICY_DIR: ${CLAUSEWISE_POLICY_DIR:-}
    volumes:
      - ${POLICY_FOLDER:-./src/clausewise/sample_policies}:/policies:ro
    restart: unless-stopped
  dashboard:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    restart: unless-stopped
