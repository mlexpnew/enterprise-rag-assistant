[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clausewise"
version = "1.0.0"
description = "Answers employees from your own policies, quoting the clause"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "scikit-learn>=1.3", "numpy>=1.26", "pdfplumber>=0.10",
                "python-docx>=1.1", "requests>=2.31"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
app = ["streamlit>=1.35", "pandas>=2.1"]
semantic = ["sentence-transformers>=2.7"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "streamlit>=1.35", "pandas>=2.1"]

[project.scripts]
clausewise = "clausewise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clausewise = ["sample_policies/*", "bench/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
